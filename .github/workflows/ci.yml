name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --dev
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest
      - name: Compile FreeCAD addon
        run: uv run python -m compileall -q Init.py InitGui.py rpc_server
      - name: Verify distribution build
        run: |
          uv build --out-dir build-check
          uv run twine check build-check/*

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Build and verify Python package
        run: |
          uv sync --dev
          uv build
          uv run twine check dist/*
      - name: Build FreeCAD addon
        run: uv run python scripts/build_addon.py
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: freecad-mcp-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
